[project]
name = "veritas"
version = "0.1.0"
description = "Narrative-vs-Numbers screening terminal over public SEC EDGAR data"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests==2.34.2",
  "lxml==6.1.3",
  "scikit-learn==1.9.1",
  "plotly==7.1.0",
  "streamlit==1.67.0",
  "reportlab==5.1.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.6", "mypy==2.4.1", "pypdf==7.1.1", "types-requests==2.33.0.20261030"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["seed_cache", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["veritas.engine.*", "veritas.models"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: requires network access to SEC EDGAR"]
